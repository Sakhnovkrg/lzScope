# Publishes site/ to GitHub Pages.
# Once: Settings -> Pages -> Source: "GitHub Actions".

name: pages

on:
  push:
    branches: [main]
    paths: ['site/**', 'preview.png', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # the page shows the same screenshot as the README
      - run: cp preview.png site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
